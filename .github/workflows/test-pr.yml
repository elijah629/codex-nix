name: Test PR

on:
  pull_request:
    paths:
      - "package.nix"
      - "flake.nix"
      - "flake.lock"
      - "scripts/update.sh"
      - ".github/workflows/**"

jobs:
  test-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - name: Build codex
        run: nix build .#codex --print-build-logs

      - name: Test version output
        run: ./result/bin/codex --version

      - name: Verify binary exists
        run: |
          test -x ./result/bin/codex
          test -x ./result/bin/codex-code-mode-host
          test -x ./result/codex-path/rg
          if [ "${{ runner.os }}" = Linux ]; then
            test -x ./result/codex-resources/bwrap
            BWRAP_DIR=$(grep -Eo "/nix/store/[a-z0-9]+-bubblewrap-[^/']+/bin" ./result/bin/codex | head -1)
            test -x "$BWRAP_DIR/bwrap"
            "$BWRAP_DIR/bwrap" --version
          fi

      - name: Test help
        run: ./result/bin/codex --help
